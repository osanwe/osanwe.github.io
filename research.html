<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petr Vytovtov | Research & Media</title>
    <style>
        :root {
            --bg: #121214;
            --text: #e1e1e6;
            --accent: #9b51e0;
            --card-bg: #1d1d22;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            margin-bottom: 30px;
        }
        .back-link {
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 svg { width: 28px; height: 28px; fill: currentColor; }
        .intro { color: #a0a0b1; margin-bottom: 40px; }
        
        .category-title {
            font-size: 1.1rem;
            color: #fff;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #29292e;
            padding-bottom: 5px;
        }
        .media-card {
            background-color: var(--card-bg);
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }
        .media-card h3 {
            margin: 0 0 6px 0;
            font-size: 1.05rem;
        }
        .media-card h3 a {
            color: #fff;
            text-decoration: none;
        }
        .media-card h3 a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        .media-card p {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #8f8f9d;
        }
        .meta {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
        }
    </style>
</head>
